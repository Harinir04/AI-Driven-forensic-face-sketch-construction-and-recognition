<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Forensic AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f4f6fb;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{background:white;border-radius:20px;padding:45px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.15);border:2px solid #eee;}
.card h2{color:#b30000;margin-bottom:6px;font-size:22px;}
.card p.sub{color:#888;font-size:13px;margin-bottom:28px;line-height:1.6;}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;}
.alert-danger{background:#fff0f0;border:1px solid #f5c6c6;color:#b30000;}
.alert-warning{background:#fffbe6;border:1px solid #ffe58f;color:#ad6800;}
.input-group{margin-bottom:16px;position:relative;}
.input-group input{width:100%;padding:14px 14px 14px 44px;border-radius:10px;border:1px solid #ddd;font-size:14px;outline:none;transition:0.3s;}
.input-group input:focus{border-color:#b30000;box-shadow:0 0 0 3px rgba(179,0,0,0.08);}
.input-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#b30000;font-size:14px;}
.req{font-size:12px;color:#888;margin-bottom:20px;}
button{width:100%;padding:14px;background:linear-gradient(45deg,#b30000,#ff3030);border:none;border-radius:30px;color:white;font-weight:600;font-size:15px;cursor:pointer;transition:0.3s;}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.2);}
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Change Password</h2>
  <p class="sub">Your account requires a password change before you can continue. Choose a strong, unique password.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" name="new_password" placeholder="New password" required minlength="8">
    </div>
    <div class="input-group">
      <i class="fa-solid fa-check-double"></i>
      <input type="password" name="confirm_password" placeholder="Confirm new password" required>
    </div>
    <p class="req">Minimum 8 characters required.</p>
    <button type="submit">Set New Password</button>
  </form>
</div>
</body>
</html>
